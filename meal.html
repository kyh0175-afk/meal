<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>야간 급식 확인</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap');
:root{--ink:#0e1117;--card:rgba(255,255,255,0.05);--card2:rgba(255,255,255,0.09);--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);--accent:#f59e0b;--ok:#34d399;--sky:#60a5fa;--red:#f87171;--text:#edf0f7;--muted:#7a8499;--r:14px;--r-sm:10px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:#0e1117!important}
body{font-family:'Noto Sans KR',sans-serif;background:#0e1117;color:#edf0f7;min-height:100vh;font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(245,158,11,.08) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 90%,rgba(249,115,22,.06) 0%,transparent 60%)}
.wrap{position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;background:rgba(14,17,23,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.logo{font-size:20px;font-weight:900;color:var(--accent);cursor:pointer}
.topbar-right{display:flex;gap:8px;margin-left:auto;align-items:center}
.sess-lbl{font-size:14px;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border:none;border-radius:var(--r-sm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s}
.btn:active{transform:scale(.96)}
.btn-amber{background:var(--accent);color:#000}.btn-green{background:var(--ok);color:#000}
.btn-red{background:var(--red);color:#000}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover{background:var(--card2)}.btn-sm{padding:7px 14px;font-size:12px}.btn-full{width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:14px}
.card-head{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 13px;color:var(--text);font-family:inherit;font-size:14px;outline:none}
.field input:focus{border-color:var(--accent)}
.stats-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat-box{flex:1;min-width:80px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 8px}
.stat-num{font-size:28px;font-weight:900;font-family:'DM Mono',monospace;line-height:1.1}
.stat-lbl{font-size:13px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{font-size:13px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border2)}
td{font-size:14px;padding:8px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-ok{background:rgba(52,211,153,.15);color:var(--ok)}
.badge-wait{background:rgba(248,113,113,.12);color:var(--red)}
.badge-qr{background:rgba(96,165,250,.12);color:var(--sky)}
.badge-manual{background:rgba(167,139,250,.12);color:#a78bfa}
.tab-bar{display:flex;gap:2px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{padding:10px 18px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all .18s}
.tab-btn:hover{background:var(--card2);color:var(--text)}.tab-btn.on{background:var(--card2);color:var(--text)}
.tab-content{display:none}.tab-content.on{display:block}
.roster-search{display:flex;gap:8px;margin-bottom:12px}
.roster-search input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none}
.roster-search input:focus{border-color:var(--accent)}
.filter-chip{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.filter-chip:hover{background:var(--card2);color:var(--text)}.filter-chip.on{background:var(--accent);color:#000;border-color:var(--accent)}
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-bar select,.filter-bar input[type="date"]{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none;-webkit-appearance:none}
/* numpad */
.numpad-wrap{position:fixed;bottom:0;left:0;right:0;background:rgba(14,17,23,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border2);padding:16px 20px 28px;z-index:300;display:none;flex-direction:column;align-items:center;gap:10px}
.numpad-display{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;text-align:center;color:var(--text);letter-spacing:4px;padding:8px 16px;width:100%;max-width:420px;border:1px solid var(--border2);border-radius:var(--r-sm);min-height:48px}
.numpad-display.full{color:var(--ok);border-color:rgba(52,211,153,.35)}
.numpad-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%;max-width:420px}
.npbtn{padding:14px 0;border:none;border-radius:var(--r-sm);font-family:'DM Mono',monospace;font-size:18px;font-weight:500;background:var(--card2);color:var(--text);cursor:pointer;transition:all .15s}
.npbtn:active{transform:scale(.93)}.npbtn-del{background:rgba(248,113,113,.15);color:var(--red)}
.npbtn-ok{background:var(--ok);color:#000;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px}
/* student screen */
.student-screen{display:none;position:fixed;inset:0;z-index:500;background:#0e1117;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.student-screen.on{display:flex}
.s-title{font-size:24px;font-weight:900;margin-bottom:8px}
.s-sub{font-size:14px;color:var(--muted);line-height:1.7;white-space:pre-line;margin-bottom:28px}
.s-input{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;text-align:center;letter-spacing:4px;background:rgba(255,255,255,.05);border:2px solid var(--border2);border-radius:12px;color:var(--text);padding:14px 20px;width:220px;outline:none}
.s-input:focus{border-color:var(--accent)}
.s-err{color:var(--red);font-size:13px;margin-top:10px;display:none;white-space:pre-line}
.s-ok{display:none;flex-direction:column;align-items:center;gap:10px}
.s-ok .check{font-size:64px;animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.ok-name{font-size:22px;font-weight:800}
.ok-meta{font-size:13px;color:var(--muted);white-space:pre-line;line-height:1.8}
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%) translateY(-20px);padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;z-index:999;pointer-events:none;transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:rgba(52,211,153,.18);color:var(--ok);border:1px solid rgba(52,211,153,.3)}
.toast.err{background:rgba(248,113,113,.18);color:var(--red);border:1px solid rgba(248,113,113,.3)}
@media(max-width:600px){.stat-num{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<div class="toast" id="toast"></div>

<!-- ══ 교사 대시보드 ══ -->
<div id="dashboard">
  <div class="topbar">
    <div class="logo" onclick="location.reload()">🍱 야간 급식</div>
    <div class="topbar-right">
      <span class="sess-lbl" id="top-date"></span>
    </div>
  </div>
  <div style="padding:24px 20px;max-width:900px;margin:0 auto">
    <div class="tab-bar">
      <button class="tab-btn on" data-tab="today" onclick="goTab('today')">📡 오늘 현황</button>
      <button class="tab-btn" data-tab="roster" onclick="goTab('roster')">📋 명단</button>
      <button class="tab-btn" data-tab="manual" onclick="goTab('manual')">✏️ 수동 입력</button>
      <button class="tab-btn" data-tab="history" onclick="goTab('history')">📂 기록</button>
    </div>

    <!-- 오늘 현황 -->
    <div class="tab-content on" id="tab-today">
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <!-- QR -->
        <div style="flex-shrink:0">
          <div style="background:#fff;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center">
            <div id="qr-render" style="width:280px;height:280px"></div>
          </div>
          <div style="margin-top:8px;font-size:13px;color:var(--muted);text-align:center">스캔하면 학생 식사 확인 화면으로 이동</div>
        </div>
        <!-- 통계 + 목록 -->
        <div style="flex:1;min-width:280px">
          <div class="stats-row">
            <div class="stat-box"><div class="stat-num" id="st-total" style="color:var(--sky)">0</div><div class="stat-lbl">오늘 대상</div></div>
            <div class="stat-box"><div class="stat-num" id="st-done" style="color:var(--ok)">0</div><div class="stat-lbl">식사 완료</div></div>
            <div class="stat-box"><div class="stat-num" id="st-remain" style="color:var(--red)">0</div><div class="stat-lbl">식사 안함</div></div>
            <div class="stat-box"><div class="stat-num" id="st-rate" style="color:var(--accent)">0%</div><div class="stat-lbl">식사 비율</div></div>
          </div>
          <div style="font-size:15px;font-weight:700;color:var(--muted);margin-bottom:8px">금일 식사 인원</div>
          <div id="today-list" style="max-height:500px;overflow-y:auto">
            <div style="font-size:14px;color:var(--muted);padding:16px;text-align:center">아직 식사한 인원이 없어요</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 명단 -->
    <div class="tab-content" id="tab-roster">
      <div class="card">
        <div class="card-head">오늘 급식 대상 명단</div>
        <div class="roster-search"><input type="text" id="roster-search" placeholder="학번 또는 이름 검색" oninput="renderRoster()"></div>
        <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
          <button class="filter-chip on" data-filter="all" onclick="setRosterFilter('all')">전체</button>
          <button class="filter-chip" data-filter="wait" onclick="setRosterFilter('wait')">🔴 식사 안함</button>
          <button class="filter-chip" data-filter="done" onclick="setRosterFilter('done')">🟢 식사 완료</button>
        </div>
        <div id="roster-count" style="font-size:12px;color:var(--muted);margin-bottom:8px"></div>
        <div style="max-height:500px;overflow-y:auto">
          <table><thead><tr><th>학번</th><th>이름</th><th>상태</th><th>시각</th></tr></thead>
          <tbody id="roster-tbody"></tbody></table>
        </div>
      </div>
    </div>

    <!-- 수동 입력 -->
    <div class="tab-content" id="tab-manual">
      <div class="card">
        <div class="card-head">수동 식사 확인</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px">QR 없이 학번을 직접 입력합니다. (18:20~19:00 시간 제한 동일 적용)</p>
        <div style="display:flex;gap:10px;align-items:flex-end">
          <div class="field" style="flex:1;margin-bottom:0"><label>학번</label>
            <input type="text" id="manual-no" placeholder="학번 입력" inputmode="numeric" onkeydown="if(event.key==='Enter')manualConfirm()">
          </div>
          <button class="btn btn-green" onclick="manualConfirm()" style="height:42px">✓ 확인</button>
        </div>
        <div id="manual-result" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <div class="card-head">넘버패드</div>
        <button class="btn btn-ghost btn-full" onclick="openNumpad()">🔢 넘버패드 열기</button>
      </div>
    </div>

    <!-- 기록 -->
    <div class="tab-content" id="tab-history">
      <div class="card">
        <div class="card-head">날짜별 기록</div>
        <div class="filter-bar">
          <input type="date" id="hist-date" onchange="loadHistoryDate()">
          <span id="hist-day" style="font-size:13px;color:var(--accent);font-weight:700"></span>
          <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="exportHistCSV()">📥 CSV</button>
        </div>
        <div class="stats-row" id="hist-stats" style="display:none">
          <div class="stat-box"><div class="stat-num" id="hist-total" style="color:var(--sky)">0</div><div class="stat-lbl">대상</div></div>
          <div class="stat-box"><div class="stat-num" id="hist-done" style="color:var(--ok)">0</div><div class="stat-lbl">식사 완료</div></div>
          <div class="stat-box"><div class="stat-num" id="hist-miss" style="color:var(--red)">0</div><div class="stat-lbl">식사 안함</div></div>
          <div class="stat-box"><div class="stat-num" id="hist-rate" style="color:var(--accent)">0%</div><div class="stat-lbl">식사 비율</div></div>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap" id="hist-filter" style="display:none">
          <button class="filter-chip on" data-hf="all" onclick="setHistFilter('all')">전체</button>
          <button class="filter-chip" data-hf="done" onclick="setHistFilter('done')">🟢 식사 완료</button>
          <button class="filter-chip" data-hf="miss" onclick="setHistFilter('miss')">🔴 식사 안함</button>
        </div>
        <div class="roster-search" id="hist-search-wrap"><input type="text" id="hist-search" placeholder="학번 또는 이름 검색" oninput="renderHistTable()"></div>
        <div style="max-height:500px;overflow-y:auto">
          <table><thead><tr><th>학번</th><th>이름</th><th>상태</th><th>시각</th><th style="width:50px"></th></tr></thead>
          <tbody id="hist-tbody"></tbody></table>
        </div>
        <div id="hist-empty" style="font-size:14px;color:var(--muted);padding:20px;text-align:center;display:none">해당 날짜의 기록이 없어요</div>
      </div>
    </div>
  </div>
</div>

<!-- ══ 학생 화면 (QR 스캔 진입) ══ -->
<div class="student-screen" id="student-screen">
  <div id="sf-input-wrap" style="display:flex;flex-direction:column;align-items:center">
    <div style="font-size:48px;margin-bottom:12px">🍱</div>
    <div class="s-title">야간 급식 확인</div>
    <div class="s-sub">학번을 입력하면 식사가 확인돼요<br><span style="color:var(--accent)">⏰ 18:20 ~ 19:00</span></div>
    <input type="text" class="s-input" id="sf-no" inputmode="numeric" placeholder="학번" maxlength="5" onkeydown="if(event.key==='Enter')doStudentConfirm()">
    <div style="margin-top:16px">
      <button class="btn btn-amber" style="padding:14px 48px;font-size:16px" id="sf-btn" onclick="doStudentConfirm()">🍱 식사 확인</button>
    </div>
    <div class="s-err" id="sf-err"></div>
  </div>
  <div class="s-ok" id="sf-ok">
    <div class="check">✅</div>
    <div class="ok-name" id="sf-ok-name"></div>
    <div class="ok-meta" id="sf-ok-meta"></div>
    <button class="btn btn-ghost" style="margin-top:20px;padding:12px 36px" onclick="resetStudent()">다른 학생 확인</button>
  </div>
</div>

<!-- ══ 넘버패드 ══ -->
<div class="numpad-wrap" id="numpad">
  <div style="display:flex;justify-content:space-between;width:100%;max-width:420px;align-items:center">
    <span style="font-size:13px;font-weight:700;color:var(--muted)">학번 입력</span>
    <button class="btn btn-ghost btn-sm" onclick="closeNumpad()">✕ 닫기</button>
  </div>
  <div class="numpad-display" id="np-display">—</div>
  <div class="numpad-grid">
    <button class="npbtn" onclick="npInput('1')">1</button><button class="npbtn" onclick="npInput('2')">2</button>
    <button class="npbtn" onclick="npInput('3')">3</button><button class="npbtn" onclick="npInput('4')">4</button>
    <button class="npbtn" onclick="npInput('5')">5</button><button class="npbtn npbtn-del" onclick="npDelete()">⌫</button>
    <button class="npbtn" onclick="npInput('6')">6</button><button class="npbtn" onclick="npInput('7')">7</button>
    <button class="npbtn" onclick="npInput('8')">8</button><button class="npbtn" onclick="npInput('9')">9</button>
    <button class="npbtn" onclick="npInput('0')">0</button><button class="npbtn" style="background:transparent;color:var(--muted)" onclick="npClear()">C</button>
  </div>
  <button class="npbtn npbtn-ok" id="np-ok" style="width:100%;max-width:420px;padding:14px" onclick="npConfirm()" disabled>🍱 식사 확인</button>
</div>
</div>

<script>
(function(){
'use strict';

const S = { roster:[], confirmed:[], pollInt:null, rosterFilter:'all', npVal:'' };

const GAS_URL = "https://script.google.com/macros/s/AKfycbwFIL1HitTOj8CruJU9uXoONyxP1XpE9ubK7nRfYR0iP0MmKr5FrLa2wwk-Rhq6b3Q/exec";

async function gasPost(payload, retry=2) {
  for (let a=0;a<=retry;a++) {
    try {
      const c=new AbortController(), t=setTimeout(()=>c.abort(),15000);
      const r=await fetch(GAS_URL,{method:"POST",body:JSON.stringify(payload),signal:c.signal});
      clearTimeout(t);
      try{return JSON.parse(await r.text())}catch(e){if(a<retry)continue;return{ok:false,msg:'서버 응답 오류'}}
    }catch(e){if(a<retry&&e.name!=='AbortError')continue;return{ok:false,msg:e.name==='AbortError'?'응답 시간 초과':'서버 연결 실패'}}
  }
}

function fmtDate(s){if(!s)return'';if(/^\d{4}-\d{2}-\d{2}$/.test(s.trim())){const p=s.trim().split('-');return p[0].slice(2)+'-'+p[1]+'-'+p[2]}const d=new Date(s);if(isNaN(d))return s;return String(d.getFullYear()).slice(2)+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtTimeShort(t){if(!t)return'';if(/^\d{2}:\d{2}:\d{2}$/.test(t))return t;if(/^\d{2}:\d{2}$/.test(t))return t;try{const d=new Date(t);if(!isNaN(d))return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}catch(e){}return t}

/* ══ 초기화 ══ */
(async function init(){
  const p=new URLSearchParams(location.search);
  if(p.get('mode')==='student'){
    document.getElementById('dashboard').style.display='none';
    document.getElementById('student-screen').classList.add('on');
    document.getElementById('sf-no').focus();
    return;
  }
  // 교사 대시보드
  document.getElementById('top-date').textContent = fmtDate(new Date().toISOString().slice(0,10));
  document.getElementById('hist-date').value = new Date().toISOString().slice(0,10);
  buildQR();
  await loadToday();
  startPolling();
})();

/* ══ 고정 QR 코드 (학생 페이지로 이동) ══ */
function buildQR(){
  const box=document.getElementById('qr-render');
  const url=location.origin+location.pathname+'?mode=student';
  const tmp=document.createElement('div');
  new QRCode(tmp,{text:url,width:280,height:280,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});
  setTimeout(()=>{box.innerHTML='';while(tmp.firstChild)box.appendChild(tmp.firstChild)},50);
}

/* ══ 오늘 데이터 로드 ══ */
async function loadToday(){
  // 명단 + 오늘 현황 병렬 로드
  const [rosterRes, statusRes] = await Promise.all([
    gasPost({action:'getRoster'}),
    gasPost({action:'getTodayStatus'})
  ]);
  if(rosterRes.ok) S.roster = rosterRes.students.filter(s=>s.isToday);
  if(statusRes.ok) S.confirmed = statusRes.confirmed.map(c=>({...c, no:String(c.no).replace(/\.0$/,'')}));
  refreshStats(); renderTodayList(); renderRoster();
}

/* ══ 폴링 (5초 간격) ══ */
function startPolling(){
  clearInterval(S.pollInt);
  S.pollInt = setInterval(async()=>{
    const r = await gasPost({action:'getTodayStatus'});
    if(!r.ok) return;
    let upd=false;
    r.confirmed.forEach(c=>{
      const no=String(c.no).replace(/\.0$/,'');
      if(!S.confirmed.find(x=>String(x.no)===no)){S.confirmed.push({...c,no});upd=true}
    });
    if(upd){refreshStats();renderTodayList();renderRoster()}
  },5000);
}

/* ══ 통계 ══ */
function refreshStats(){
  const total=S.roster.length, done=S.confirmed.length, remain=Math.max(0,total-done);
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-remain').textContent=remain;
  document.getElementById('st-rate').textContent=(total>0?Math.round(done/total*100):0)+'%';
}

/* ══ 오늘 식사 인원 목록 ══ */
function renderTodayList(){
  const el=document.getElementById('today-list');
  if(!S.confirmed.length){el.innerHTML='<div style="font-size:14px;color:var(--muted);padding:16px;text-align:center">아직 식사한 인원이 없어요</div>';return}
  const list=[...S.confirmed].reverse().slice(0,30);
  el.innerHTML='<table><thead><tr><th>학번</th><th>이름</th><th>시각</th></tr></thead><tbody>'
    +list.map(c=>`<tr><td style="font-family:'DM Mono',monospace;font-size:14px">${c.no}</td><td style="font-size:14px">${c.name}</td><td style="font-family:'DM Mono',monospace;font-size:13px">${fmtTimeShort(c.time)}</td></tr>`).join('')+'</tbody></table>';
}

/* ══ 명단 탭 ══ */
function setRosterFilter(f){S.rosterFilter=f;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',b.dataset.filter===f));renderRoster()}
window.setRosterFilter=setRosterFilter;

function renderRoster(){
  const doneSet=new Set(S.confirmed.map(c=>String(c.no)));
  const q=(document.getElementById('roster-search').value||'').trim().toLowerCase();
  let list=S.roster.map(s=>{const rec=S.confirmed.find(c=>String(c.no)===String(s.no));return{...s,isDone:!!rec,time:rec?rec.time:''}});
  if(S.rosterFilter==='done')list=list.filter(s=>s.isDone);
  else if(S.rosterFilter==='wait')list=list.filter(s=>!s.isDone);
  if(q)list=list.filter(s=>String(s.no).includes(q)||s.name.toLowerCase().includes(q));
  list.sort((a,b)=>{if(a.isDone!==b.isDone)return a.isDone?1:-1;return String(a.no).localeCompare(String(b.no))});
  const doneCount=S.roster.filter(s=>doneSet.has(String(s.no))).length;
  document.getElementById('roster-count').textContent=`표시: ${list.length}명 / 전체: ${S.roster.length}명 (식사 완료 ${doneCount}명)`;
  const tbody=document.getElementById('roster-tbody');
  if(!list.length){tbody.innerHTML='<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">해당하는 학생이 없어요</td></tr>';return}
  tbody.innerHTML=list.map(s=>{
    const badge=s.isDone?'<span class="badge badge-ok">식사 완료</span>':'<span class="badge badge-wait">식사 안함</span>';
    const tc=s.isDone?fmtTimeShort(s.time):'<button class="btn btn-green btn-sm" onclick="manualConfirmNo(\''+s.no+'\')">수동 확인</button>';
    return`<tr><td style="font-family:'DM Mono',monospace">${s.no}</td><td>${s.name}</td><td>${badge}</td><td style="font-family:'DM Mono',monospace;font-size:12px">${tc}</td></tr>`}).join('');
}
window.renderRoster=renderRoster;

/* ══ 탭 전환 ══ */
function goTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['today','roster','manual','history'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('on',t===tab));
  if(tab==='roster')renderRoster();
  if(tab==='history')loadHistoryDate();
}
window.goTab=goTab;

/* ══ 식사 확인 요청 ══ */
async function tryConfirm(no,method){
  if(!no)return{ok:false,msg:'학번을 입력해주세요.'};
  no=String(no).trim();
  if(S.confirmed.find(c=>String(c.no)===no))return{ok:false,msg:'이미 식사 확인된 학생이에요.'};
  const local=S.roster.find(s=>String(s.no)===no);
  const tmp={no,name:local?local.name:no,time:new Date().toTimeString().slice(0,8),method:method||'QR',_p:true};
  S.confirmed.push(tmp);refreshStats();renderTodayList();renderRoster();
  const r=await gasPost({action:'confirmMeal',studentNo:no,method:method||'QR'});
  if(!r.ok){const idx=S.confirmed.indexOf(tmp);if(idx!==-1)S.confirmed.splice(idx,1);refreshStats();renderTodayList();renderRoster();return{ok:false,msg:r.msg}}
  tmp.name=r.name;tmp.time=r.time;delete tmp._p;
  refreshStats();renderTodayList();renderRoster();
  return{ok:true,name:r.name,time:r.time};
}

/* ══ 학생 전체화면 ══ */
async function doStudentConfirm(){
  const err=document.getElementById('sf-err');err.style.display='none';
  const btn=document.getElementById('sf-btn');btn.disabled=true;btn.textContent='확인 중...';
  const r=await tryConfirm(document.getElementById('sf-no').value.trim(),'QR');
  btn.disabled=false;btn.textContent='🍱 식사 확인';
  if(!r.ok){err.textContent=r.msg;err.style.display='block';return}
  document.getElementById('sf-input-wrap').style.display='none';
  document.getElementById('sf-ok').style.display='flex';
  document.getElementById('sf-ok-name').textContent=r.name+' 학생';
  document.getElementById('sf-ok-meta').textContent='식사 시각: '+fmtTimeShort(r.time);
}
window.doStudentConfirm=doStudentConfirm;
function resetStudent(){document.getElementById('sf-input-wrap').style.display='flex';document.getElementById('sf-ok').style.display='none';document.getElementById('sf-no').value='';document.getElementById('sf-err').style.display='none';document.getElementById('sf-no').focus()}
window.resetStudent=resetStudent;

/* ══ 수동 확인 ══ */
async function manualConfirm(){
  const no=document.getElementById('manual-no').value.trim();
  const el=document.getElementById('manual-result');
  el.innerHTML='<span style="color:var(--muted)">처리 중...</span>';
  const r=await tryConfirm(no,'수동');
  if(!r.ok){el.innerHTML=`<span style="color:var(--red)">${r.msg}</span>`;return}
  el.innerHTML=`<span style="color:var(--ok)">✓ ${r.name} 식사 확인 (${fmtTimeShort(r.time)})</span>`;
  document.getElementById('manual-no').value='';
}
window.manualConfirm=manualConfirm;
async function manualConfirmNo(no){const r=await tryConfirm(no,'수동');if(r.ok)toast(r.name+' 식사 확인!','ok');else toast(r.msg,'err')}
window.manualConfirmNo=manualConfirmNo;

/* ══ 넘버패드 ══ */
function openNumpad(){S.npVal='';npRefresh();document.getElementById('numpad').style.display='flex'}
window.openNumpad=openNumpad;
function closeNumpad(){document.getElementById('numpad').style.display='none'}window.closeNumpad=closeNumpad;
function npInput(d){if(S.npVal.length>=5)return;S.npVal+=d;npRefresh()}window.npInput=npInput;
function npDelete(){S.npVal=S.npVal.slice(0,-1);npRefresh()}window.npDelete=npDelete;
function npClear(){S.npVal='';npRefresh()}window.npClear=npClear;
function npRefresh(){const d=document.getElementById('np-display');d.textContent=S.npVal||'—';d.classList.toggle('full',S.npVal.length>=4);document.getElementById('np-ok').disabled=S.npVal.length<4}
async function npConfirm(){if(S.npVal.length<4)return;const r=await tryConfirm(S.npVal,'수동');if(r.ok){toast(r.name+' 식사 확인!','ok');S.npVal='';npRefresh()}else toast(r.msg,'err')}
window.npConfirm=npConfirm;

/* ══ 기록 탭 ══ */
var _histData={roster:[],records:[],date:'',day:''}, _histFilter='all';
async function loadHistoryDate(){
  const date=document.getElementById('hist-date').value;if(!date)return;
  const r=await gasPost({action:'getMealHistory',date});
  if(!r.ok){_histData={roster:[],records:[],date:date,day:''};document.getElementById('hist-stats').style.display='none';document.getElementById('hist-tbody').innerHTML='';document.getElementById('hist-empty').style.display='block';return}
  _histData={roster:r.roster||[],records:r.records||[],date:r.date||date,day:r.day||''};
  document.getElementById('hist-day').textContent=_histData.day?'('+_histData.day+'요일)':'';
  document.getElementById('hist-stats').style.display='flex';document.getElementById('hist-empty').style.display='none';
  const doneSet=new Set(_histData.records.map(r=>String(r.no)));
  const total=_histData.roster.length,done=_histData.roster.filter(s=>doneSet.has(String(s.no))).length,miss=total-done;
  document.getElementById('hist-total').textContent=total;document.getElementById('hist-done').textContent=done;
  document.getElementById('hist-miss').textContent=miss;document.getElementById('hist-rate').textContent=(total>0?Math.round(done/total*100):0)+'%';
  _histFilter='all';document.querySelectorAll('[data-hf]').forEach(b=>b.classList.toggle('on',b.dataset.hf==='all'));
  document.getElementById('hist-search').value='';renderHistTable();
}
window.loadHistoryDate=loadHistoryDate;
function setHistFilter(f){_histFilter=f;document.querySelectorAll('[data-hf]').forEach(b=>b.classList.toggle('on',b.dataset.hf===f));renderHistTable()}
window.setHistFilter=setHistFilter;
function renderHistTable(){
  const doneMap={};_histData.records.forEach(r=>{doneMap[String(r.no)]=r});
  let list=_histData.roster.map(s=>{const rec=doneMap[String(s.no)];return{no:s.no,name:s.name,isDone:!!rec,time:rec?rec.time:''}});
  if(_histFilter==='done')list=list.filter(s=>s.isDone);else if(_histFilter==='miss')list=list.filter(s=>!s.isDone);
  const q=(document.getElementById('hist-search').value||'').trim().toLowerCase();
  if(q)list=list.filter(s=>String(s.no).includes(q)||s.name.toLowerCase().includes(q));
  list.sort((a,b)=>{if(a.isDone!==b.isDone)return a.isDone?1:-1;return String(a.no).localeCompare(String(b.no))});
  const tbody=document.getElementById('hist-tbody');
  if(!list.length&&!_histData.roster.length){tbody.innerHTML='';document.getElementById('hist-empty').style.display='block';return}
  document.getElementById('hist-empty').style.display='none';
  if(!list.length){tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">해당하는 학생이 없어요</td></tr>';return}
  tbody.innerHTML=list.map(s=>{
    const delBtn=s.isDone?`<button class="btn btn-ghost btn-sm" onclick="deleteRecord('${s.no}','${_histData.date}')" style="color:var(--red);border-color:rgba(248,113,113,.3);font-size:11px;padding:4px 8px">삭제</button>`:'';
    return`<tr><td style="font-family:'DM Mono',monospace">${s.no}</td><td>${s.name}</td><td>${s.isDone?'<span class="badge badge-ok">식사 완료</span>':'<span class="badge badge-wait">식사 안함</span>'}</td><td style="font-family:'DM Mono',monospace;font-size:12px">${s.isDone?fmtTimeShort(s.time):'—'}</td><td>${delBtn}</td></tr>`
  }).join('');
}
window.renderHistTable=renderHistTable;

async function deleteRecord(no, date){
  if(!confirm(no+' 학생의 '+date+' 식사 기록을 삭제할까요?'))return;
  const r=await gasPost({action:'deleteMealRecord',no:no,date:date});
  if(!r.ok){toast(r.msg,'err');return}
  toast(r.msg,'ok');
  // 로컬에서도 제거
  _histData.records=_histData.records.filter(rec=>!(String(rec.no)===no));
  // 오늘 현황에서도 제거 (오늘 날짜인 경우)
  const today=new Date().toISOString().slice(0,10);
  if(date===today){S.confirmed=S.confirmed.filter(c=>String(c.no)!==no);refreshStats();renderTodayList();renderRoster()}
  // 통계 재계산 + 테이블 재렌더
  const doneSet=new Set(_histData.records.map(r=>String(r.no)));
  const total=_histData.roster.length,done=_histData.roster.filter(s=>doneSet.has(String(s.no))).length,miss=total-done;
  document.getElementById('hist-total').textContent=total;document.getElementById('hist-done').textContent=done;
  document.getElementById('hist-miss').textContent=miss;document.getElementById('hist-rate').textContent=(total>0?Math.round(done/total*100):0)+'%';
  renderHistTable();
}
window.deleteRecord=deleteRecord;
function exportHistCSV(){
  const doneMap={};_histData.records.forEach(r=>{doneMap[String(r.no)]=r});
  const list=_histData.roster.map(s=>{const rec=doneMap[String(s.no)];return{no:s.no,name:s.name,status:rec?'식사 완료':'식사 안함',time:rec?fmtTimeShort(rec.time):''}});
  if(!list.length){toast('내보낼 데이터가 없어요','err');return}
  list.sort((a,b)=>String(a.no).localeCompare(String(b.no)));
  const csv='\uFEFF학번,이름,상태,식사시각\n'+list.map(c=>`${c.no},${c.name},${c.status},${c.time}`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='급식기록_'+_histData.date+'.csv';a.click();toast('CSV 다운로드 완료','ok');
}
window.exportHistCSV=exportHistCSV;

/* ══ 토스트 ══ */
function toast(msg,type){const el=document.getElementById('toast');el.textContent=msg;el.className='toast '+(type||'ok');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2800)}

})();
</script>
